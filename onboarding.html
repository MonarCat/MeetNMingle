<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set up your profile — MeetNMingle</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  .interest-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .avatar-picker { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .avatar-preview { width: 84px; height: 84px; border-radius: 50%; background: var(--ink); background-size: cover; background-position: center; border: 2px dashed rgba(74,36,56,0.2); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--cream-dim); flex-shrink: 0; overflow: hidden; }
  .checkbox-row { display: flex; align-items: center; gap: 10px; }
  .checkbox-row input { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="page-wrap">
  <div style="text-align:center; margin: 20px 0 28px;">
    <div class="logo" style="font-size:1.4rem;">meet<em>n</em>mingle</div>
    <p style="color:var(--cream-dim); font-size:0.9rem; margin-top:6px;">Let's set up your profile</p>
  </div>

  <form id="onboardForm" class="card" style="padding:26px;">
    <div class="avatar-picker">
      <div class="avatar-preview" id="avatarPreview">Photo</div>
      <div>
        <input type="file" id="avatarFile" accept="image/*" style="display:none;">
        <button type="button" class="btn btn-outline btn-sm" id="pickAvatarBtn">Upload photo</button>
      </div>
    </div>

    <div class="field">
      <label>Display name</label>
      <input type="text" id="displayName" required maxlength="40" placeholder="What should people call you?">
    </div>

    <div class="field">
      <label>Date of birth (must be 18+)</label>
      <input type="date" id="dob" required>
    </div>

    <div class="field">
      <label>I am</label>
      <select id="gender" required>
        <option value="">Select…</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="nonbinary">Non-binary</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="field">
      <label>Interested in (select all that apply)</label>
      <div id="interestedInPicker" class="interest-grid"></div>
    </div>

    <div class="field">
      <label>County</label>
      <select id="county" required></select>
    </div>

    <div class="field">
      <label>Town / area (optional)</label>
      <input type="text" id="town" maxlength="60" placeholder="e.g. Kahawa Sukari">
    </div>

    <div class="field">
      <label>Bio</label>
      <textarea id="bio" rows="3" maxlength="300" placeholder="Tell people a bit about you…"></textarea>
    </div>

    <div class="field">
      <label>Your interests (pick a few — this drives your matches)</label>
      <div id="interestsPicker" class="interest-grid"></div>
    </div>

    <div class="field">
      <div class="checkbox-row">
        <input type="checkbox" id="ageConfirm" required>
        <label style="margin:0;" for="ageConfirm">I confirm I am 18 years or older</label>
      </div>
    </div>

    <div id="formError" class="field-error" style="margin-bottom:14px;"></div>
    <button type="submit" class="btn btn-primary btn-block" id="saveBtn">Finish & start matching</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase, requireAuth, KENYAN_COUNTIES } from './js/supabaseClient.js';

  let session;
  let avatarBlob = null;
  const selectedInterests = new Set();
  const selectedGenders = new Set();

  function toast(msg, type='') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + type;
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  const countySelect = document.getElementById('county');
  countySelect.innerHTML = '<option value="">Select…</option>' +
    KENYAN_COUNTIES.map(c => `<option value="${c}">${c}</option>`).join('');

  const genderPicker = document.getElementById('interestedInPicker');
  ['male','female','nonbinary','other'].forEach(g => {
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'pill';
    pill.textContent = g.charAt(0).toUpperCase() + g.slice(1);
    pill.onclick = () => {
      if (selectedGenders.has(g)) { selectedGenders.delete(g); pill.classList.remove('selected'); }
      else { selectedGenders.add(g); pill.classList.add('selected'); }
    };
    genderPicker.appendChild(pill);
  });

  document.getElementById('pickAvatarBtn').onclick = () => document.getElementById('avatarFile').click();
  document.getElementById('avatarFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    avatarBlob = file;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('avatarPreview').style.backgroundImage = `url(${ev.target.result})`;
      document.getElementById('avatarPreview').textContent = '';
    };
    reader.readAsDataURL(file);
  });

  async function loadInterests() {
    const { data, error } = await supabase.from('interests').select('id,name').order('name');
    if (error) { console.error(error); return; }
    const picker = document.getElementById('interestsPicker');
    data.forEach(interest => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'pill';
      pill.textContent = interest.name;
      pill.onclick = () => {
        if (selectedInterests.has(interest.id)) { selectedInterests.delete(interest.id); pill.classList.remove('selected'); }
        else { selectedInterests.add(interest.id); pill.classList.add('selected'); }
      };
      picker.appendChild(pill);
    });
  }

  (async () => {
    session = await requireAuth();
    if (!session) return;
    await loadInterests();
  })();

  document.getElementById('onboardForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('formError');
    errEl.textContent = '';

    const dob = document.getElementById('dob').value;
    const age = Math.floor((Date.now() - new Date(dob).getTime()) / (1000*60*60*24*365.25));
    if (age < 18) { errEl.textContent = 'You must be 18 or older to join.'; return; }
    if (selectedGenders.size === 0) { errEl.textContent = 'Select who you\'re interested in.'; return; }
    if (selectedInterests.size === 0) { errEl.textContent = 'Pick at least one interest.'; return; }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';

    let avatarUrl = null;
    if (avatarBlob) {
      const path = `${session.user.id}/${Date.now()}-${avatarBlob.name}`;
      const { error: upErr } = await supabase.storage.from('avatars').upload(path, avatarBlob, { upsert: true });
      if (upErr) { errEl.textContent = 'Photo upload failed: ' + upErr.message; btn.disabled = false; btn.textContent = 'Finish & start matching'; return; }
      const { data: pub } = supabase.storage.from('avatars').getPublicUrl(path);
      avatarUrl = pub.publicUrl;
    }

    const { error: profErr } = await supabase.from('profiles').insert({
      id: session.user.id,
      display_name: document.getElementById('displayName').value.trim(),
      date_of_birth: dob,
      gender: document.getElementById('gender').value,
      interested_in: Array.from(selectedGenders),
      county: countySelect.value,
      town: document.getElementById('town').value.trim() || null,
      bio: document.getElementById('bio').value.trim() || null,
      avatar_url: avatarUrl,
    });

    if (profErr) {
      errEl.textContent = profErr.message;
      btn.disabled = false; btn.textContent = 'Finish & start matching';
      return;
    }

    const rows = Array.from(selectedInterests).map(interest_id => ({ profile_id: session.user.id, interest_id }));
    if (rows.length) await supabase.from('profile_interests').insert(rows);

    toast('Profile created!', 'success');
    window.location.href = 'discover.html';
  });
</script>
</body>
</html>
