<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MeetNMingle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6">Join MeetNMingle</h2>
        <form id="registerForm">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="name">Full Name</label>
                <input type="text" id="name" class="w-full p-3 border rounded-lg" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="email">Email</label>
                <input type="email" id="email" class="w-full p-3 border rounded-lg" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="password">Password</label>
                <input type="password" id="password" class="w-full p-3 border rounded-lg" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="age">Age</label>
                <input type="number" id="age" class="w-full p-3 border rounded-lg" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="gender">Gender</label>
                <select id="gender" class="w-full p-3 border rounded-lg" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="location">Location</label>
                <input type="text" id="location" class="w-full p-3 border rounded-lg" placeholder="e.g., New York, NY">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="interests">Interests (comma-separated)</label>
                <input type="text" id="interests" class="w-full p-3 border rounded-lg" placeholder="e.g., hiking, music, travel">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="photo">Profile Photo</label>
                <input type="file" id="photo" accept="image/*" class="w-full p-3 border rounded-lg">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 mb-2" for="bio">Bio</label>
                <textarea id="bio" class="w-full p-3 border rounded-lg" rows="4"></textarea>
            </div>
            <button type="submit" class="w-full bg-pink-600 text-white p-3 rounded-lg font-semibold hover:bg-pink-700">Sign Up</button>
        </form>
        <p class="text-center mt-4">Already have an account? <a href="login.html" class="text-pink-600 hover:underline">Login</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
