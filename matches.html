
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches - MeetNMingle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans">
    <!-- Header -->
    <header class="bg-pink-600 text-white py-4">
        <div class="container mx-auto flex justify-between items-center px-4">
            <h1 class="text-2xl font-bold">MeetNMingle</h1>
            <nav>
                <a href="index.html" class="px-4 hover:underline">Home</a>
                <a href="profile.html" class="px-4 hover:underline">Profile</a>
                <a href="messages.html" class="px-4 hover:underline">Messages</a>
                <a href="#" id="logout" class="px-4 hover:underline">Logout</a>
            </nav>
        </div>
    </header>

    <!-- Matches Section -->
    <section class="py-16">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-8">Find Your Match</h2>
            <!-- Search and Filters -->
            <div class="bg-white p-6 rounded-lg shadow-lg mb-8">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="text" id="searchName" class="p-3 border rounded-lg" placeholder="Search by name...">
                    <label for="filterGender" class="sr-only">Filter by Gender</label>
                    <select id="filterGender" class="p-3 border rounded-lg" aria-label="Filter by Gender">
                        <option value="">All Genders</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="number" id="filterAgeMin" class="p-3 border rounded-lg" placeholder="Min Age">
                    <input type="number" id="filterAgeMax" class="p-3 border rounded-lg" placeholder="Max Age">
                </div>
                <button id="applyFilters" class="mt-4 bg-pink-600 text-white p-3 rounded-lg font-semibold hover:bg-pink-700">Apply Filters</button>
            </div>
            <!-- Matches List -->
            <div id="matchesList" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>
    </section>

    <script src="mockUsers.js"></script>
    <script src="script.js"></script>
</body>
</html>
