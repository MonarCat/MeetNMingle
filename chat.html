<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — MeetNMingle</title>
<link rel="stylesheet" href="css/tokens.css">
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
<style>
  body { padding-bottom: 0; }
  .chat-header { display:flex; align-items:center; gap:12px; padding: 14px 18px; background: var(--ink-soft); border-bottom: 1px solid rgba(251,244,234,0.08); position: sticky; top:0; z-index: 20; }
  .chat-header .avatar { width:40px; height:40px; border-radius:50%; background: var(--plum); background-size:cover; background-position:center; }
  .chat-header .name { font-weight:700; }
  .chat-header .back { font-size: 1.3rem; margin-right: 4px; }
  .chat-wrap { max-width: 560px; margin: 0 auto; display:flex; flex-direction:column; height: calc(100vh - 130px); }
  .messages { flex:1; overflow-y:auto; padding: 18px; display:flex; flex-direction:column; gap:10px; }
  .msg-row { display:flex; }
  .msg-row.mine { justify-content:flex-end; }
  .bubble { max-width: 74%; padding: 10px 14px; border-radius: 18px; font-size: 0.92rem; }
  .msg-row.mine .bubble { background: var(--coral); color: var(--cream); border-bottom-right-radius: 4px; }
  .msg-row.theirs .bubble { background: var(--ink-soft); border-bottom-left-radius: 4px; }
  .msg-time { font-size: 0.66rem; color: var(--cream-dim); margin-top: 4px; text-align: right; }
  .media-bubble { padding: 0; overflow: hidden; border-radius: 16px; max-width: 220px; }
  .media-bubble img { width: 100%; display:block; }
  .view-once-btn { display:flex; flex-direction:column; align-items:center; gap:8px; padding: 24px; background: var(--ink); border-radius:16px; min-width:160px; }
  .composer { display:flex; align-items:center; gap:10px; padding: 12px 16px; background: var(--ink-soft); border-top: 1px solid rgba(251,244,234,0.08); }
  .composer input[type=text] { flex:1; background: var(--ink); border: 1.5px solid rgba(251,244,234,0.12); border-radius: 999px; padding: 12px 16px; color: var(--cream); font-size: 0.9rem; }
  .icon-btn { width: 42px; height:42px; border-radius:50%; background: var(--ink); border: none; color: var(--cream-dim); font-size: 1.1rem; flex-shrink:0; }
  .send-btn { background: var(--coral); color: var(--cream); }

  .media-modal-backdrop { position: fixed; inset:0; background: rgba(0,0,0,0.8); z-index: 70; display:none; align-items:center; justify-content:center; padding: 20px; }
  .media-modal-backdrop.open { display:flex; }
  .media-modal-backdrop img { max-width: 100%; max-height: 80vh; border-radius: 12px; }

  .share-sheet-backdrop { position: fixed; inset:0; background: rgba(0,0,0,0.6); z-index:60; display:none; align-items:flex-end; justify-content:center; }
  .share-sheet-backdrop.open { display:flex; }
  .share-sheet { background: var(--ink-soft); width:100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 22px; }
  .share-sheet h3 { margin-top:0; font-family: var(--font-display); }
  .toggle-row { display:flex; align-items:center; justify-content:space-between; padding: 12px 0; border-bottom: 1px solid rgba(251,244,234,0.08); }
  .toggle-row div div:first-child { font-weight:600; font-size:0.9rem; }
  .toggle-row div div:last-child { font-size:0.76rem; color:var(--cream-dim); }
  .switch { position:relative; width:44px; height:26px; background: rgba(251,244,234,0.15); border-radius:999px; border:none; }
  .switch.on { background: var(--coral); }
  .switch::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition: transform 0.15s ease; }
  .switch.on::after { transform: translateX(18px); }

  /* Calls */
  .call-btn { font-size: 1.05rem; }
  #callModal { position: fixed; inset:0; background: var(--ink); z-index: 90; display:none; flex-direction:column; }
  #callModal.open { display:flex; }
  #callRemoteVideo { flex:1; background:#000; position:relative; }
  #callLocalVideo { position:absolute; bottom:100px; right:16px; width:110px; height:150px; background:var(--plum); border-radius:12px; overflow:hidden; z-index:2; border: 2px solid rgba(251,244,234,0.25); }
  .call-status-bar { position:absolute; top:0; left:0; right:0; padding: 18px; text-align:center; color:var(--cream); background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent); z-index:2; }
  .call-controls { display:flex; gap:16px; justify-content:center; padding: 22px; background: var(--ink-soft); }
  .call-ctrl-btn { width:56px; height:56px; border-radius:50%; border:none; font-size:1.3rem; background: rgba(251,244,234,0.12); color:var(--cream); }
  .call-ctrl-btn.hangup { background: var(--coral); }
  .call-ctrl-btn.off { background: rgba(232,93,76,0.35); }

  #incomingCallBanner { position: fixed; top:0; left:0; right:0; z-index: 95; display:none; background: var(--ink-soft); padding: 16px 20px; align-items:center; gap:14px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  #incomingCallBanner.open { display:flex; }
  #incomingCallBanner .ic-info { flex:1; }
  #incomingCallBanner .ic-name { font-weight:700; }
  #incomingCallBanner .ic-sub { font-size:0.78rem; color:var(--cream-dim); }
  .ic-accept { background: #3FAE5C; color:#fff; border:none; border-radius:50%; width:44px; height:44px; font-size:1.1rem; }
  .ic-decline { background: var(--coral); color:#fff; border:none; border-radius:50%; width:44px; height:44px; font-size:1.1rem; }

  /* Voice notes */
  .voice-bubble { display:flex; align-items:center; gap:10px; padding: 10px 14px; min-width: 160px; }
  .voice-bubble .vb-play { width:32px; height:32px; border-radius:50%; background: rgba(251,244,234,0.15); border:none; color:inherit; flex-shrink:0; }
  .voice-bubble .vb-dur { font-size:0.76rem; opacity:0.8; }
  #recordBtn.recording { background: var(--coral); color:#fff; animation: pulse 1s infinite; }
  #recordIndicator { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--coral); color:#fff; padding:8px 18px; border-radius:999px; font-size:0.82rem; font-weight:700; display:none; z-index:60; }
  #recordIndicator.show { display:block; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.45;} }
  #callAudioOnlyIndicator { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:1.8rem; background: var(--plum); z-index:1; }
</style>
</head>
<body>

<div class="chat-header">
  <a href="matches.html" class="back">←</a>
  <div class="avatar" id="peerAvatar"></div>
  <div style="flex:1;">
    <div class="name" id="peerName">Loading…</div>
  </div>
  <button class="icon-btn call-btn" id="voiceCallBtn" title="Voice call">📞</button>
  <button class="icon-btn call-btn" id="videoCallBtn" title="Video call">🎥</button>
  <button class="icon-btn" id="rateBtn" title="Rate this person">⭐</button>
</div>

<div id="incomingCallBanner">
  <div class="ic-info">
    <div class="ic-name" id="icName">Incoming call</div>
    <div class="ic-sub" id="icSub"></div>
  </div>
  <button class="ic-decline" id="icDeclineBtn">✕</button>
  <button class="ic-accept" id="icAcceptBtn">✓</button>
</div>

<div id="callModal">
  <div id="callRemoteVideo">
    <div id="callLocalVideo">
      <div class="audio-only-indicator" id="callAudioOnlyIndicator">🎙️</div>
    </div>
    <div class="call-status-bar" id="callStatusBar">Calling…</div>
  </div>
  <div class="call-controls">
    <button class="call-ctrl-btn" id="callMicBtn">🎤</button>
    <button class="call-ctrl-btn" id="callCamBtn">📷</button>
    <button class="call-ctrl-btn" id="callFlipCamBtn" style="display:none;">🔄</button>
    <button class="call-ctrl-btn hangup" id="callHangupBtn">📵</button>
  </div>
</div>

<div class="chat-wrap">
  <div class="messages" id="messages"></div>
  <div class="composer">
    <button class="icon-btn" id="attachBtn">📎</button>
    <button class="icon-btn" id="recordBtn" title="Hold to record a voice note">🎙️</button>
    <input type="text" id="textInput" placeholder="Type a message…">
    <button class="icon-btn send-btn" id="sendBtn">➤</button>
  </div>
</div>
<div id="recordIndicator">● Recording… <span id="recordTime">0:00</span> (release to send)</div>

<input type="file" id="fileInput" accept="image/*" style="display:none;">

<div class="share-sheet-backdrop" id="shareSheet">
  <div class="share-sheet">
    <h3>Send photo</h3>
    <div class="toggle-row">
      <div><div>View once</div><div>Disappears after they open it once</div></div>
      <button class="switch" id="viewOnceToggle"></button>
    </div>
    <div class="toggle-row" style="border-bottom:none;">
      <div><div>Allow saving</div><div>Let them download/keep this photo</div></div>
      <button class="switch on" id="allowSaveToggle"></button>
    </div>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn btn-outline btn-block" id="shareCancelBtn">Cancel</button>
      <button class="btn btn-primary btn-block" id="shareSendBtn">Send</button>
    </div>
  </div>
</div>

<div class="media-modal-backdrop" id="mediaModal">
  <img id="mediaModalImg" src="">
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase, requireAuth, requireProfile, SUPABASE_URL, SUPABASE_ANON_KEY } from './js/supabaseClient.js';

  function toast(msg, type='') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + type;
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  const params = new URLSearchParams(window.location.search);
  const matchId = params.get('match');
  let me, peer, conversationId, pendingFile = null;

  const messagesEl = document.getElementById('messages');

  function bubbleTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  async function renderMessage(msg) {
    const mine = msg.sender_id === me.id;
    const row = document.createElement('div');
    row.className = 'msg-row ' + (mine ? 'mine' : 'theirs');
    row.dataset.id = msg.id;

    if (msg.media_path || (msg.is_view_once && !msg.media_path)) {
      const consumed = msg.is_view_once && msg.viewed_at;
      if (msg.is_view_once && !consumed && !mine) {
        const wrap = document.createElement('div');
        wrap.className = 'bubble view-once-btn';
        wrap.innerHTML = `<div style="font-size:1.6rem;">📷</div><div style="font-size:0.82rem;">Tap to view once</div>`;
        wrap.onclick = () => openViewOnce(msg.id);
        row.appendChild(wrap);
      } else if (msg.is_view_once && consumed) {
        const wrap = document.createElement('div');
        wrap.className = 'bubble';
        wrap.style.opacity = '0.6';
        wrap.textContent = mine ? '📷 Photo (viewed)' : '📷 Photo — already viewed';
        row.appendChild(wrap);
      } else if (msg.is_view_once && mine && !consumed) {
        const wrap = document.createElement('div');
        wrap.className = 'bubble';
        wrap.textContent = '📷 Sent — view once (not opened yet)';
        row.appendChild(wrap);
      } else if (msg.media_path && msg.media_type === 'audio') {
        const wrap = document.createElement('div');
        wrap.className = 'bubble voice-bubble';
        const btn = document.createElement('button');
        btn.className = 'vb-play';
        btn.textContent = '▶';
        const dur = document.createElement('span');
        dur.className = 'vb-dur';
        dur.textContent = msg.media_duration_seconds ? `${Math.floor(msg.media_duration_seconds/60)}:${String(msg.media_duration_seconds%60).padStart(2,'0')}` : '';
        let audioEl = null;
        btn.onclick = async () => {
          if (audioEl) {
            if (audioEl.paused) { audioEl.play(); btn.textContent = '⏸'; } else { audioEl.pause(); btn.textContent = '▶'; }
            return;
          }
          const { data } = await supabase.storage.from('chat-media').createSignedUrl(msg.media_path, 3600);
          if (!data) return;
          audioEl = new Audio(data.signedUrl);
          audioEl.onended = () => { btn.textContent = '▶'; };
          audioEl.play();
          btn.textContent = '⏸';
        };
        wrap.appendChild(btn);
        wrap.appendChild(document.createTextNode('🎙️'));
        wrap.appendChild(dur);
        row.appendChild(wrap);
      } else if (msg.media_path) {
        const wrap = document.createElement('div');
        wrap.className = 'bubble media-bubble';
        const img = document.createElement('img');
        if (!msg.allow_save) { img.oncontextmenu = () => false; img.draggable = false; }
        const { data } = await supabase.storage.from('chat-media').createSignedUrl(msg.media_path, 3600);
        if (data) img.src = data.signedUrl;
        wrap.appendChild(img);
        row.appendChild(wrap);
      }
    } else {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = msg.content;
      row.appendChild(bubble);
    }

    const container = document.createElement('div');
    container.appendChild(row);
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.style.textAlign = mine ? 'right' : 'left';
    time.textContent = bubbleTime(msg.created_at);
    container.appendChild(time);
    messagesEl.appendChild(container);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function openViewOnce(messageId) {
    const { data: msgRow } = await supabase.from('messages').select('media_path').eq('id', messageId).maybeSingle();
    if (!msgRow || !msgRow.media_path) { toast('This photo is no longer available.', 'error'); return; }
    const { data: signed } = await supabase.storage.from('chat-media').createSignedUrl(msgRow.media_path, 60);
    if (!signed) { toast('Could not open photo.', 'error'); return; }
    const modal = document.getElementById('mediaModal');
    const img = document.getElementById('mediaModalImg');
    img.onload = async () => {
      await supabase.rpc('consume_view_once_message', { p_message_id: messageId });
    };
    img.src = signed.signedUrl;
    modal.classList.add('open');
  }
  document.getElementById('mediaModal').onclick = async () => {
    document.getElementById('mediaModal').classList.remove('open');
    await reloadThread();
  };

  async function loadThread() {
    const { data: msgs, error } = await supabase.from('messages')
      .select('*').eq('conversation_id', conversationId).order('created_at', { ascending: true });
    if (error) { console.error(error); return; }
    messagesEl.innerHTML = '';
    for (const m of msgs) await renderMessage(m);
  }
  async function reloadThread() { await loadThread(); }

  document.getElementById('sendBtn').onclick = async () => {
    const input = document.getElementById('textInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    const { error } = await supabase.from('messages').insert({ conversation_id: conversationId, sender_id: me.id, content: text });
    if (error) toast('Message failed to send', 'error');
  };
  document.getElementById('textInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('sendBtn').click();
  });

  document.getElementById('attachBtn').onclick = () => {
    if (me.subscription_tier === 'free') {
      toast('Upgrade to Premium to share photos in chat.', 'error');
      setTimeout(() => window.location.href = 'pricing.html', 1400);
      return;
    }
    document.getElementById('fileInput').click();
  };
  document.getElementById('fileInput').addEventListener('change', (e) => {
    pendingFile = e.target.files[0];
    if (!pendingFile) return;
    document.getElementById('shareSheet').classList.add('open');
  });
  document.getElementById('viewOnceToggle').onclick = (e) => e.target.classList.toggle('on');
  document.getElementById('allowSaveToggle').onclick = (e) => e.target.classList.toggle('on');
  document.getElementById('shareCancelBtn').onclick = () => {
    document.getElementById('shareSheet').classList.remove('open');
    pendingFile = null;
    document.getElementById('fileInput').value = '';
  };
  document.getElementById('shareSendBtn').onclick = async () => {
    if (!pendingFile) return;
    const isViewOnce = document.getElementById('viewOnceToggle').classList.contains('on');
    const allowSave = document.getElementById('allowSaveToggle').classList.contains('on');
    const path = `${me.id}/${conversationId}-${Date.now()}-${pendingFile.name}`;
    const { error: upErr } = await supabase.storage.from('chat-media').upload(path, pendingFile);
    document.getElementById('shareSheet').classList.remove('open');
    document.getElementById('fileInput').value = '';
    if (upErr) { toast('Upload failed: ' + upErr.message, 'error'); pendingFile = null; return; }
    const { error } = await supabase.from('messages').insert({
      conversation_id: conversationId, sender_id: me.id,
      media_path: path, media_type: 'image',
      is_view_once: isViewOnce, allow_save: isViewOnce ? false : allowSave,
    });
    pendingFile = null;
    if (error) toast('Could not send photo', 'error');
  };

  // ---------- Voice notes (push-to-hold record) ----------
  let mediaRecorder = null, recordChunks = [], recordStart = 0, recordTimerInt = null;

  function canUseRichMedia() {
    if (me.subscription_tier === 'free') {
      toast('Upgrade to Premium to send voice notes.', 'error');
      setTimeout(() => window.location.href = 'pricing.html', 1400);
      return false;
    }
    return true;
  }

  async function startRecording() {
    if (!canUseRichMedia()) return;
    if (mediaRecorder) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const durationSec = Math.round((Date.now() - recordStart) / 1000);
        clearInterval(recordTimerInt);
        document.getElementById('recordIndicator').classList.remove('show');
        document.getElementById('recordBtn').classList.remove('recording');
        if (durationSec < 1) { mediaRecorder = null; return; }
        const blob = new Blob(recordChunks, { type: 'audio/webm' });
        const path = `${me.id}/${conversationId}-${Date.now()}-voice.webm`;
        const { error: upErr } = await supabase.storage.from('chat-media').upload(path, blob);
        mediaRecorder = null;
        if (upErr) { toast('Voice note failed: ' + upErr.message, 'error'); return; }
        const { error } = await supabase.from('messages').insert({
          conversation_id: conversationId, sender_id: me.id,
          media_path: path, media_type: 'audio', media_duration_seconds: durationSec,
        });
        if (error) toast('Could not send voice note', 'error');
      };
      mediaRecorder.start();
      recordStart = Date.now();
      document.getElementById('recordIndicator').classList.add('show');
      document.getElementById('recordBtn').classList.add('recording');
      recordTimerInt = setInterval(() => {
        const s = Math.round((Date.now() - recordStart) / 1000);
        document.getElementById('recordTime').textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
      }, 250);
    } catch (e) {
      toast('Microphone access is needed to record a voice note.', 'error');
    }
  }
  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  }
  const recordBtn = document.getElementById('recordBtn');
  recordBtn.addEventListener('pointerdown', startRecording);
  recordBtn.addEventListener('pointerup', stopRecording);
  recordBtn.addEventListener('pointerleave', stopRecording);

  // ---------- Video / voice calls ----------
  let agoraClient = null, localTracks = { mic: null, cam: null };
  let activeCall = null, callQuotaInterval = null, callsChannel = null;

  async function getAgoraToken(channelName, uid, callId) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/agora-token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${(await supabase.auth.getSession()).data.session.access_token}`, apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({ channelName, uid, callId }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Could not get a call token');
    return json;
  }
  function randomUid() { return Math.floor(Math.random() * 900000) + 100000; }

  async function setupCallClient() {
    if (agoraClient) return agoraClient;
    agoraClient = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
    agoraClient.on('user-published', async (user, mediaType) => {
      await agoraClient.subscribe(user, mediaType);
      if (mediaType === 'video') user.videoTrack.play('callRemoteVideo');
      if (mediaType === 'audio') user.audioTrack.play();
    });
    return agoraClient;
  }

  function startCallQuota() {
    if (me.subscription_tier === 'premium' || me.is_admin) return;
    callQuotaInterval = setInterval(async () => {
      try {
        const { data: remaining, error } = await supabase.rpc('consume_live_seconds', { p_seconds: 15 });
        if (error) throw error;
        if (remaining <= 0) {
          toast('Your 5 free minutes of video/voice today are used up. Upgrade to Premium for unlimited calls.', 'error');
          await endCall();
          setTimeout(() => window.location.href = 'pricing.html', 1600);
        }
      } catch (e) { console.error(e); }
    }, 15000);
  }
  function stopCallQuota() { if (callQuotaInterval) { clearInterval(callQuotaInterval); callQuotaInterval = null; } }

  async function joinCallChannel(call, withVideo) {
    const uid = randomUid();
    const { token, appId } = await getAgoraToken(call.channel_name, uid, call.id);
    const client = await setupCallClient();
    await client.join(appId, call.channel_name, token, uid);
    try { localTracks.mic = await AgoraRTC.createMicrophoneAudioTrack(); } catch (e) { console.error(e); }
    if (withVideo) {
      try {
        localTracks.cam = await AgoraRTC.createCameraVideoTrack();
        localTracks.cam.play('callLocalVideo');
        try {
          const cams = await AgoraRTC.getCameras();
          callCameraDevices = cams || [];
        } catch (e) { callCameraDevices = []; }
        document.getElementById('callFlipCamBtn').style.display = callCameraDevices.length > 1 ? 'inline-flex' : 'none';
      } catch (e) {
        console.error(e);
        toast((e?.code === 'PERMISSION_DENIED' || e?.name === 'NotAllowedError') ? 'Camera permission was denied — continuing as audio-only.' : 'No camera found — continuing as audio-only.', 'error');
      }
    }
    document.getElementById('callAudioOnlyIndicator').style.display = localTracks.cam ? 'none' : 'flex';
    const tracks = [localTracks.mic, localTracks.cam].filter(Boolean);
    if (tracks.length) await client.publish(tracks);
    document.getElementById('callStatusBar').textContent = withVideo && localTracks.cam ? '' : `Voice call with ${peer?.display_name || ''}`;
    startCallQuota();
  }

  let callCameraDevices = [], callCameraDeviceIndex = 0;
  document.getElementById('callFlipCamBtn').onclick = async () => {
    if (!localTracks.cam || callCameraDevices.length < 2) return;
    callCameraDeviceIndex = (callCameraDeviceIndex + 1) % callCameraDevices.length;
    try {
      await localTracks.cam.setDevice(callCameraDevices[callCameraDeviceIndex].deviceId);
    } catch (e) {
      toast('Could not switch camera.', 'error');
    }
  };

  async function endCall() {
    localTracks.mic?.close(); localTracks.cam?.close();
    localTracks = { mic: null, cam: null };
    if (agoraClient) { await agoraClient.leave(); }
    if (activeCall) {
      await supabase.from('calls').update({ status: 'ended', ended_at: new Date().toISOString() }).eq('id', activeCall.id).eq('status', 'accepted');
      await supabase.from('calls').update({ status: 'ended', ended_at: new Date().toISOString() }).eq('id', activeCall.id).eq('status', 'ringing');
    }
    activeCall = null;
    stopCallQuota();
    if (outgoingCallChannel) { supabase.removeChannel(outgoingCallChannel); outgoingCallChannel = null; }
    document.getElementById('callModal').classList.remove('open');
    document.getElementById('incomingCallBanner').classList.remove('open');
    document.getElementById('callFlipCamBtn').style.display = 'none';
    document.getElementById('callAudioOnlyIndicator').style.display = 'none';
    callCameraDevices = []; callCameraDeviceIndex = 0;
  }

  let outgoingCallChannel = null;
  async function startOutgoingCall(callType) {
    const { data: created, error } = await supabase.from('calls').insert({
      conversation_id: conversationId, caller_id: me.id, callee_id: peer.id, call_type: callType,
    }).select().single();
    if (error) { toast(error.message, 'error'); return; }
    activeCall = created;
    document.getElementById('callModal').classList.add('open');
    document.getElementById('callStatusBar').textContent = `Calling ${peer?.display_name || ''}…`;
    document.getElementById('callCamBtn').style.display = callType === 'video' ? 'inline-flex' : 'none';

    // Wait for the callee to accept/decline.
    outgoingCallChannel = supabase
      .channel(`call-${created.id}`)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'calls', filter: `id=eq.${created.id}` }, async (payload) => {
        if (payload.new.status === 'accepted' && activeCall) {
          await joinCallChannel(created, callType === 'video');
        } else if (['declined', 'ended', 'missed'].includes(payload.new.status)) {
          toast(payload.new.status === 'declined' ? 'Call declined.' : 'Call ended.', '');
          await endCall();
        }
      })
      .subscribe();
  }

  document.getElementById('voiceCallBtn').onclick = () => startOutgoingCall('voice');
  document.getElementById('videoCallBtn').onclick = () => startOutgoingCall('video');
  document.getElementById('callHangupBtn').onclick = endCall;
  document.getElementById('callMicBtn').onclick = async () => {
    if (!localTracks.mic) return;
    const enabled = localTracks.mic.enabled !== false;
    await localTracks.mic.setEnabled(!enabled);
    document.getElementById('callMicBtn').classList.toggle('off', enabled);
  };
  document.getElementById('callCamBtn').onclick = async () => {
    if (!localTracks.cam) return;
    const enabled = localTracks.cam.enabled !== false;
    await localTracks.cam.setEnabled(!enabled);
    document.getElementById('callCamBtn').classList.toggle('off', enabled);
  };

  let incomingCall = null;
  document.getElementById('icAcceptBtn').onclick = async () => {
    if (!incomingCall) return;
    const call = incomingCall;
    incomingCall = null;
    document.getElementById('incomingCallBanner').classList.remove('open');
    const { error } = await supabase.from('calls').update({ status: 'accepted', started_at: new Date().toISOString() }).eq('id', call.id).eq('status', 'ringing');
    if (error) { toast('That call is no longer available.', 'error'); return; }
    activeCall = call;
    document.getElementById('callModal').classList.add('open');
    document.getElementById('callCamBtn').style.display = call.call_type === 'video' ? 'inline-flex' : 'none';
    await joinCallChannel(call, call.call_type === 'video');
  };
  document.getElementById('icDeclineBtn').onclick = async () => {
    if (!incomingCall) return;
    const call = incomingCall;
    incomingCall = null;
    document.getElementById('incomingCallBanner').classList.remove('open');
    await supabase.from('calls').update({ status: 'declined' }).eq('id', call.id).eq('status', 'ringing');
  };

  function watchForIncomingCalls() {
    callsChannel = supabase
      .channel(`calls-inbox-${me.id}`)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'calls' }, (payload) => {
        const call = payload.new;
        if (call.callee_id !== me.id || call.status !== 'ringing') return;
        if (call.conversation_id !== conversationId) return; // this page only handles this conversation's calls
        incomingCall = call;
        document.getElementById('icName').textContent = peer?.display_name || 'Someone';
        document.getElementById('icSub').textContent = call.call_type === 'video' ? 'Incoming video call' : 'Incoming voice call';
        document.getElementById('incomingCallBanner').classList.add('open');
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'calls' }, (payload) => {
        const call = payload.new;
        if (incomingCall && call.id === incomingCall.id && call.status !== 'ringing') {
          incomingCall = null;
          document.getElementById('incomingCallBanner').classList.remove('open');
          toast('The caller ended the call.', '');
        }
      })
      .subscribe();
  }

  document.getElementById('rateBtn').onclick = () => {
    window.location.href = `profile.html?rate=${peer.id}`;
  };

  (async () => {
    const session = await requireAuth();
    if (!session) return;
    me = await requireProfile(session);
    if (!me) return;
    if (!matchId) { window.location.href = 'matches.html'; return; }

    const { data: match, error: matchErr } = await supabase.from('matches').select('*').eq('id', matchId).maybeSingle();
    if (matchErr || !match) { window.location.href = 'matches.html'; return; }
    const peerId = match.user1_id === me.id ? match.user2_id : match.user1_id;
    const { data: peerProfile } = await supabase.from('profiles').select('*').eq('id', peerId).maybeSingle();
    peer = peerProfile;
    document.getElementById('peerName').textContent = peer?.display_name || 'MeetNMingle user';
    if (peer?.avatar_url) document.getElementById('peerAvatar').style.backgroundImage = `url('${peer.avatar_url}')`;

    let { data: conv } = await supabase.from('conversations').select('id').eq('match_id', matchId).maybeSingle();
    conversationId = conv?.id;
    if (!conversationId) { toast('Conversation not ready yet, please retry.', 'error'); return; }

    await loadThread();
    await supabase.rpc('mark_conversation_read', { p_conversation_id: conversationId });
    watchForIncomingCalls();

    supabase
      .channel(`conv-${conversationId}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'messages', filter: `conversation_id=eq.${conversationId}` },
        async () => {
          await loadThread();
          await supabase.rpc('mark_conversation_read', { p_conversation_id: conversationId });
        })
      .subscribe();
  })();
</script>
</body>
</html>
