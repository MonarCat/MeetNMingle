<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MeetNMingle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6">Login to MeetNMingle</h2>
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="email">Email</label>
                <input type="email" id="email" class="w-full p-3 border rounded-lg" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 mb-2" for="password">Password</label>
                <input type="password" id="password" class="w-full p-3 border rounded-lg" required>
            </div>
            <button type="submit" class="w-full bg-pink-600 text-white p-3 rounded-lg font-semibold hover:bg-pink-700">Login</button>
        </form>
        <p class="text-center mt-4">Don't have an account? <a href="register.html" class="text-pink-600 hover:underline">Sign Up</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
