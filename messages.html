<!--Messaging interface-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - MeetNMingle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans">
    <!-- Header -->
    <header class="bg-pink-600 text-white py-4">
        <div class="container mx-auto flex justify-between items-center px-4">
            <h1 class="text-2xl font-bold">MeetNMingle</h1>
            <nav>
                <a href="index.html" class="px-4 hover:underline">Home</a>
                <a href="profile.html" class="px-4 hover:underline">Profile</a>
                <a href="matches.html" class="px-4 hover:underline">Matches</a>
                <a href="#" id="logout" class="px-4 hover:underline">Logout</a>
            </nav>
        </div>
    </header>

    <!-- Messages Section -->
    <section class="py-16">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-8">Messages</h2>
            <div class="bg-white p-6 rounded-lg shadow-lg flex flex-col md:flex-row">
                <!-- Chat List -->
                <div class="w-full md:w-1/3 border-r p-4">
                    <h3 class="text-lg font-semibold mb-4">Chats</h3>
                    <ul id="chatList" class="space-y-2"></ul>
                </div>
                <!-- Chat Window -->
                <div class="w-full md:w-2/3 p-4">
                    <div id="chatHeader" class="text-lg font-semibold mb-4"></div>
                    <div id="chatMessages" class="h-64 overflow-y-auto border p-4 mb-4"></div>
                    <form id="messageForm" class="flex">
                        <input type="text" id="messageInput" class="flex-1 p-3 border rounded-l-lg" placeholder="Type a message...">
                        <button type="submit" class="bg-pink-600 text-white p-3 rounded-r-lg hover:bg-pink-700">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="mockUsers.js"></script>
    <script src="script.js"></script>
</body>
</html>
