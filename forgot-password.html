<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — MeetNMingle</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  .auth-wrap { max-width: 400px; margin: 0 auto; padding: 40px 20px 60px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .auth-card { padding: 32px 28px; }
  .brand { text-align: center; margin-bottom: 24px; }
  .switch-line { text-align: center; margin-top: 18px; font-size: 0.88rem; color: var(--cream-dim); }
  .switch-line a { color: var(--coral); font-weight: 700; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="brand"><div class="logo" style="font-size:1.6rem;">meet<em>n</em>mingle</div></div>
  <div class="card auth-card">
    <h2 class="display" style="margin-top:0; font-size:1.3rem;">Forgot your password?</h2>
    <p style="color:var(--cream-dim); font-size:0.88rem; margin-top:-6px;">Enter your email and we'll send you a reset link.</p>
    <form id="forgotForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div id="formError" class="field-error"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
    </form>
    <p class="switch-line"><a href="auth.html">← Back to log in</a></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from './js/supabaseClient.js';

  function toast(msg, type='') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + type;
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('formError');
    errEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Sending…';

    const email = document.getElementById('email').value.trim();
    const redirectTo = new URL('reset-password.html', window.location.href).toString();
    const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });

    btn.disabled = false; btn.textContent = 'Send reset link';
    if (error) { errEl.textContent = error.message; return; }
    toast('If that email has an account, a reset link is on its way.', 'success');
    document.getElementById('forgotForm').reset();
  });
</script>
</body>
</html>
