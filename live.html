<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live — MeetNMingle</title>
<link rel="stylesheet" href="css/tokens.css">
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
<style>
  .live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .live-card { border-radius: var(--radius-md); overflow: hidden; cursor: pointer; position: relative; background: var(--plum); aspect-ratio: 3/4; display:flex; align-items:flex-end; }
  .live-badge { position:absolute; top:10px; left:10px; background: var(--coral); color:var(--cream); font-size:0.62rem; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; display:flex; align-items:center; gap:4px; }
  .live-badge .dot { width:6px; height:6px; border-radius:50%; background:#fff; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .live-card-info { padding: 10px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.7)); width:100%; }
  .live-card-info .host { font-weight:700; font-size:0.85rem; }
  .live-card-info .title { font-size:0.74rem; color:var(--cream-dim); }

  #stageWrap { display:none; }
  #stageWrap.open { display:block; }
  #localVideo, #remoteVideo { width: 100%; aspect-ratio: 16/9; background: var(--ink); border-radius: var(--radius-md); overflow: hidden; }
  .stage-controls { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap: wrap; }
  .stage-meta { text-align:center; margin: 14px 0; }
  .tip-row { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap: wrap; }
  .tip-btn { padding: 8px 16px; border-radius: 999px; border: 1.5px solid rgba(251,244,234,0.15); background: var(--ink-soft); color: var(--cream-dim); font-weight:700; font-size:0.82rem; }

  .go-live-card { border: 1.5px dashed rgba(251,244,234,0.2); border-radius: var(--radius-md); padding: 20px; text-align:center; margin-bottom: 22px; }
  .quota-badge { display:inline-flex; align-items:center; gap:6px; background: rgba(243,165,59,0.15); color: var(--amber); font-size:0.78rem; font-weight:700; padding:6px 14px; border-radius:999px; margin-top:10px; }
  .stage-quota { text-align:center; font-size:0.8rem; color:var(--amber); margin-top:8px; }

  /* Live chat */
  #liveChatPanel { margin-top:16px; border-radius: var(--radius-md); background: var(--ink-soft); display:flex; flex-direction:column; height: 280px; }
  #liveChatMessages { flex:1; overflow-y:auto; padding: 12px 14px; display:flex; flex-direction:column; gap:6px; }
  .live-chat-row { font-size: 0.82rem; line-height:1.35; }
  .live-chat-row .lc-name { font-weight:700; margin-right:6px; }
  .live-chat-row.masked .lc-name { color: var(--cream-dim); font-style: italic; }
  .live-chat-composer { display:flex; gap:8px; padding: 10px; border-top: 1px solid rgba(251,244,234,0.08); }
  .live-chat-composer input[type=text] { flex:1; background: var(--ink); border: 1.5px solid rgba(251,244,234,0.12); border-radius: 999px; padding: 9px 14px; color: var(--cream); font-size: 0.85rem; }
  .mask-toggle-btn { width:38px; height:38px; border-radius:50%; border:1.5px solid rgba(251,244,234,0.15); background:var(--ink); flex-shrink:0; font-size:1rem; }
  .mask-toggle-btn.active { background: var(--coral); border-color: var(--coral); }
  .live-chat-send { width:38px; height:38px; border-radius:50%; background: var(--coral); color:#fff; border:none; flex-shrink:0; }

  /* Audience panel (host) */
  #audiencePanel { display:none; margin-top:16px; border-radius: var(--radius-md); background: var(--ink-soft); padding: 14px; max-height: 320px; overflow-y:auto; }
  #audiencePanel.open { display:block; }
  .audience-row { display:flex; align-items:center; gap:10px; padding: 8px 0; border-bottom: 1px solid rgba(251,244,234,0.06); }
  .audience-row .aud-avatar { width:36px; height:36px; border-radius:50%; background: var(--plum); background-size:cover; background-position:center; flex-shrink:0; }
  .audience-row .aud-info { flex:1; min-width:0; }
  .audience-row .aud-name { font-weight:700; font-size:0.85rem; }
  .audience-row .aud-tip { font-size:0.72rem; }
  .audience-row .aud-tip.tipped { color: var(--amber); }
  .audience-row .aud-tip.not-tipped { color: var(--cream-dim); }
  .kick-btn { background: transparent; border: 1.5px solid var(--coral); color: var(--coral); border-radius: 999px; padding: 4px 10px; font-size: 0.7rem; font-weight:700; flex-shrink:0; }
</style>
</head>
<body>
<div class="page-wrap">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
    <h1 class="display" style="font-size:1.6rem; margin:0;">Live now</h1>
  </div>

  <div class="go-live-card" id="goLiveCard">
    <p style="color:var(--cream-dim); font-size:0.88rem; margin:0 0 12px;" id="goLiveText">Free accounts get 5 minutes of live video a day — hosting or watching.</p>
    <button class="btn btn-primary" id="goLiveBtn">🔴 Go live</button>
  </div>

  <div id="liveGrid" class="live-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div style="font-size:2.5rem;">📡</div>
    <p>No one is live right now. Check back soon!</p>
  </div>

  <div id="stageWrap">
    <div id="remoteVideo"></div>
    <div id="localVideo" style="display:none;"></div>
    <div class="stage-meta">
      <div id="stageTitle" style="font-weight:700;"></div>
      <div id="stageHost" style="color:var(--cream-dim); font-size:0.85rem;"></div>
      <div id="stageQuota" class="stage-quota" style="display:none;"></div>
    </div>
    <div class="stage-controls" id="hostControls" style="display:none;">
      <button class="btn btn-outline" id="toggleMicBtn">🎤 Mute</button>
      <button class="btn btn-outline" id="toggleCamBtn">📷 Hide cam</button>
      <button class="btn btn-outline" id="audienceToggleBtn">👥 Audience (0)</button>
      <button class="btn btn-outline" id="editTipsBtn">💛 Edit tip amounts</button>
      <button class="btn" style="background:var(--coral); color:var(--cream);" id="endLiveBtn">End live</button>
    </div>
    <div class="stage-controls" id="audienceControls" style="display:none;">
      <button class="btn btn-outline" id="leaveLiveBtn">Leave</button>
    </div>
    <div class="tip-row" id="tipRow" style="display:none;"></div>

    <div id="audiencePanel"></div>

    <div id="liveChatPanel" style="display:none;">
      <div id="liveChatMessages"></div>
      <div class="live-chat-composer">
        <button class="mask-toggle-btn" id="maskToggleBtn" title="Send anonymously">🎭</button>
        <input type="text" id="liveChatInput" placeholder="Say something…" maxlength="300">
        <button class="live-chat-send" id="liveChatSendBtn">➤</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase, requireAuth, requireProfile, SUPABASE_URL, SUPABASE_ANON_KEY } from './js/supabaseClient.js';
  import { renderTabbar } from './js/tabbar.js';
  renderTabbar('live');

  function toast(msg, type='') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + type;
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  let me, session;
  let agoraClient = null;
  let localTracks = { mic: null, cam: null };
  let currentSession = null;
  let isHosting = false;
  let quotaInterval = null;
  let chatChannel = null, kickChannel = null;
  let lastChatTs = null;
  let liveChatMasked = false;

  async function getToken(channelName, uid) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/agora-token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({ channelName, uid }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Could not get a video token');
    return json;
  }

  function fmtMinSec(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  let heartbeatInterval = null;
  function startHeartbeat() {
    if (!isHosting || !currentSession) return;
    heartbeatInterval = setInterval(() => {
      supabase.rpc('heartbeat_live_session', { p_session_id: currentSession.id }).catch(e => console.error(e));
    }, 20000);
  }
  function stopHeartbeat() {
    if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
  }

  function startQuotaTracking() {
    if (me.subscription_tier === 'premium' || me.is_admin) return; // unlimited
    document.getElementById('stageQuota').style.display = 'block';
    quotaInterval = setInterval(async () => {
      try {
        const { data: remaining, error } = await supabase.rpc('consume_live_seconds', { p_seconds: 15 });
        if (error) throw error;
        document.getElementById('stageQuota').textContent = `⏱ ${fmtMinSec(remaining)} left today on the Free plan`;
        if (remaining <= 0) {
          toast('Your 5 free minutes are up for today. Upgrade to Premium for unlimited live video.', 'error');
          await leaveStage();
          setTimeout(() => window.location.href = 'pricing.html', 1600);
        }
      } catch (e) {
        console.error(e);
      }
    }, 15000);
  }
  function stopQuotaTracking() {
    if (quotaInterval) { clearInterval(quotaInterval); quotaInterval = null; }
    document.getElementById('stageQuota').style.display = 'none';
  }

  // ---------- Live chat ----------
  function renderChatRow(m) {
    const wrap = document.getElementById('liveChatMessages');
    const row = document.createElement('div');
    row.className = 'live-chat-row' + (m.display_mode === 'masked' ? ' masked' : '');
    const nameEl = document.createElement('span');
    nameEl.className = 'lc-name';
    nameEl.textContent = (m.display_mode === 'masked' ? '🎭 ' : '') + (m.display_name || 'Guest') + ':';
    row.appendChild(nameEl);
    row.appendChild(document.createTextNode(m.content));
    wrap.appendChild(row);
    wrap.scrollTop = wrap.scrollHeight;
  }

  async function loadLiveChat() {
    const { data, error } = await supabase.rpc('get_live_chat_messages', {
      p_session_id: currentSession.id, p_after: lastChatTs,
    });
    if (error) { console.error(error); return; }
    (data || []).forEach(m => { renderChatRow(m); lastChatTs = m.created_at; });
  }

  function openLiveChat() {
    document.getElementById('liveChatPanel').style.display = 'flex';
    document.getElementById('liveChatMessages').innerHTML = '';
    lastChatTs = null;
    loadLiveChat();
    chatChannel = supabase
      .channel(`live-chat-${currentSession.id}`)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'live_chat_messages', filter: `session_id=eq.${currentSession.id}` },
        () => loadLiveChat())
      .subscribe();
  }
  function closeLiveChat() {
    document.getElementById('liveChatPanel').style.display = 'none';
    if (chatChannel) { supabase.removeChannel(chatChannel); chatChannel = null; }
  }

  document.getElementById('maskToggleBtn').onclick = (e) => {
    liveChatMasked = !liveChatMasked;
    e.currentTarget.classList.toggle('active', liveChatMasked);
    e.currentTarget.title = liveChatMasked ? 'Sending anonymously — tap to use your name' : 'Send anonymously';
  };
  async function sendLiveChat() {
    const input = document.getElementById('liveChatInput');
    const text = input.value.trim();
    if (!text || !currentSession) return;
    input.value = '';
    const { error } = await supabase.rpc('post_live_chat_message', {
      p_session_id: currentSession.id, p_content: text, p_masked: liveChatMasked,
    });
    if (error) toast(error.message, 'error');
  }
  document.getElementById('liveChatSendBtn').onclick = sendLiveChat;
  document.getElementById('liveChatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendLiveChat(); });

  // ---------- Kick listener (viewer side) ----------
  function watchForKick() {
    kickChannel = supabase
      .channel(`kick-watch-${currentSession.id}-${me.id}`)
      .on('postgres_changes', {
        event: 'UPDATE', schema: 'public', table: 'live_session_participants',
        filter: `session_id=eq.${currentSession.id}`,
      }, (payload) => {
        if (payload.new.user_id === me.id && payload.new.is_kicked) {
          toast('You were removed from this live session by the host.', 'error');
          leaveStage();
        }
      })
      .subscribe();
  }

  // ---------- Audience panel (host) ----------
  async function refreshAudience() {
    const { data, error } = await supabase.rpc('get_live_audience', { p_session_id: currentSession.id });
    if (error) { console.error(error); return; }
    const active = (data || []).filter(p => !p.left_at && !p.is_kicked);
    document.getElementById('audienceToggleBtn').textContent = `👥 Audience (${active.length})`;
    const panel = document.getElementById('audiencePanel');
    if (!data || data.length === 0) {
      panel.innerHTML = '<p style="color:var(--cream-dim); font-size:0.85rem; text-align:center;">No one has joined yet.</p>';
      return;
    }
    panel.innerHTML = data.map(p => `
      <div class="audience-row">
        <div class="aud-avatar" style="${p.avatar_url ? `background-image:url('${p.avatar_url}')` : ''}"></div>
        <div class="aud-info">
          <div class="aud-name">${p.display_name}${p.left_at ? ' (left)' : ''}${p.is_kicked ? ' (removed)' : ''}</div>
          <div class="aud-tip ${p.has_tipped ? 'tipped' : 'not-tipped'}">${p.has_tipped ? `💛 Tipped KES ${p.total_tipped_kes}` : 'Not tipped'}</div>
        </div>
        ${(!p.is_kicked && !p.left_at) ? `<button class="kick-btn" data-uid="${p.user_id}">Remove</button>` : ''}
      </div>
    `).join('');
    panel.querySelectorAll('.kick-btn').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('Remove this viewer from your live session?')) return;
        const { error } = await supabase.rpc('kick_live_participant', { p_session_id: currentSession.id, p_user_id: btn.dataset.uid });
        if (error) toast(error.message, 'error'); else { toast('Viewer removed.', 'success'); refreshAudience(); }
      };
    });
  }
  document.getElementById('audienceToggleBtn').onclick = () => {
    const panel = document.getElementById('audiencePanel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) refreshAudience();
  };
  document.getElementById('editTipsBtn').onclick = async () => {
    const current = (currentSession.tip_options || [50,100,200,500]).join(', ');
    const input = prompt('Tip amounts in KES, comma-separated (max 6):', current);
    if (input === null) return;
    const amounts = input.split(',').map(s => parseInt(s.trim(), 10)).filter(n => Number.isFinite(n) && n > 0).slice(0, 6);
    if (amounts.length === 0) { toast('Enter at least one valid amount.', 'error'); return; }
    const { error } = await supabase.rpc('set_live_tip_options', { p_session_id: currentSession.id, p_options: amounts });
    if (error) { toast(error.message, 'error'); return; }
    currentSession.tip_options = amounts;
    renderTipRow(amounts);
    toast('Tip amounts updated.', 'success');
  };

  function renderTipRow(options) {
    const row = document.getElementById('tipRow');
    row.innerHTML = (options || [50,100,200,500]).map(amt =>
      `<button class="tip-btn" data-amt="${amt}">💛 Tip KES ${amt}</button>`
    ).join('');
    row.querySelectorAll('.tip-btn').forEach(btn => {
      btn.onclick = () => tipHost(Number(btn.dataset.amt));
    });
  }

  async function tipHost(amountKes) {
    if (!currentSession) return;
    try {
      const callback_url = window.location.origin + window.location.pathname;
      const res = await fetch(`${SUPABASE_URL}/functions/v1/paystack-init`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_ANON_KEY },
        body: JSON.stringify({ purpose: 'live_tip', session_id: currentSession.id, amount_kes: amountKes, callback_url }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Could not start payment');
      window.location.href = json.authorization_url;
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  async function handlePaystackReturn() {
    const params = new URLSearchParams(window.location.search);
    const reference = params.get('reference') || params.get('trxref');
    if (!reference) return;
    window.history.replaceState({}, '', window.location.pathname);
    toast('Confirming your tip…', '');
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/paystack-verify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_ANON_KEY },
        body: JSON.stringify({ reference }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Could not confirm payment');
      toast('Tip sent — thank you! 💛 Rejoin the stream to keep watching.', 'success');
    } catch (e) {
      toast('Payment could not be confirmed: ' + e.message, 'error');
    }
  }

  async function leaveStage() {
    // The DB write is the source of truth and must happen no matter what --
    // previously this ran AFTER Agora client teardown, so any client-side
    // hiccup (or an already-broken connection) could leave a session stuck
    // 'live' forever with no way for the host to end it.
    if (currentSession) {
      try {
        if (isHosting) {
          const { error } = await supabase.from('live_sessions')
            .update({ status: 'ended', ended_at: new Date().toISOString() })
            .eq('id', currentSession.id);
          if (error) throw error;
        } else {
          await supabase.rpc('leave_live_session', { p_session_id: currentSession.id });
        }
      } catch (e) {
        console.error('Failed to update session status', e);
        toast('Could not confirm with the server, but leaving locally.', 'error');
      }
    }
    // Best-effort cleanup from here -- none of this should block the above.
    try { localTracks.mic?.close(); } catch (e) { console.error(e); }
    try { localTracks.cam?.close(); } catch (e) { console.error(e); }
    localTracks = { mic: null, cam: null };
    try { if (agoraClient) await agoraClient.leave(); } catch (e) { console.error(e); }
    closeLiveChat();
    if (kickChannel) { supabase.removeChannel(kickChannel); kickChannel = null; }
    stopQuotaTracking();
    stopHeartbeat();
    currentSession = null;
    isHosting = false;
    hideStage();
    loadLiveSessions();
  }

  function randomUid() {
    return Math.floor(Math.random() * 900000) + 100000;
  }

  async function loadLiveSessions() {
    const staleCutoff = new Date(Date.now() - 90000).toISOString();
    const { data, error } = await supabase.from('live_sessions')
      .select('id, title, channel_name, host_id, status, started_at, last_heartbeat_at, tip_options, profiles!live_sessions_host_id_fkey(display_name, avatar_url)')
      .eq('status', 'live')
      .order('started_at', { ascending: false });
    const gridEl = document.getElementById('liveGrid');
    const emptyEl = document.getElementById('emptyState');
    gridEl.innerHTML = '';
    // A session with no heartbeat yet (just started) gets a grace period;
    // one that's gone stale (host's tab likely crashed/disconnected)
    // shouldn't show as live to other users even before the host's own
    // client gets a chance to clean it up.
    const live = (data || []).filter(s => {
      if (s.last_heartbeat_at) return s.last_heartbeat_at >= staleCutoff;
      return s.started_at >= staleCutoff;
    });
    if (error || live.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    live.forEach(s => {
      const host = s.profiles;
      const card = document.createElement('div');
      card.className = 'live-card';
      card.style.backgroundImage = host?.avatar_url ? `url('${host.avatar_url}')` : '';
      card.style.backgroundSize = 'cover';
      card.style.backgroundPosition = 'center';
      card.innerHTML = `
        <span class="live-badge"><span class="dot"></span> LIVE</span>
        <div class="live-card-info">
          <div class="host">${host?.display_name || 'Host'}</div>
          <div class="title">${s.title || ''}</div>
        </div>
      `;
      card.onclick = () => joinAsAudience(s);
      gridEl.appendChild(card);
    });
  }

  async function setupClient() {
    if (agoraClient) return agoraClient;
    agoraClient = AgoraRTC.createClient({ mode: 'live', codec: 'vp8' });
    agoraClient.on('user-published', async (user, mediaType) => {
      await agoraClient.subscribe(user, mediaType);
      if (mediaType === 'video') {
        user.videoTrack.play('remoteVideo');
      }
      if (mediaType === 'audio') {
        user.audioTrack.play();
      }
    });
    return agoraClient;
  }

  function showStage() {
    document.getElementById('stageWrap').classList.add('open');
    window.scrollTo({ top: document.getElementById('stageWrap').offsetTop - 20, behavior: 'smooth' });
  }
  function hideStage() {
    document.getElementById('stageWrap').classList.remove('open');
    document.getElementById('localVideo').style.display = 'none';
    document.getElementById('hostControls').style.display = 'none';
    document.getElementById('audienceControls').style.display = 'none';
    document.getElementById('tipRow').style.display = 'none';
    document.getElementById('audiencePanel').classList.remove('open');
    document.getElementById('audiencePanel').innerHTML = '';
  }

  async function joinAsAudience(s) {
    try {
      const { error: joinErr } = await supabase.rpc('join_live_session', { p_session_id: s.id, p_display_mode: 'public' });
      if (joinErr) throw joinErr;

      const uid = randomUid();
      const { token, appId } = await getToken(s.channel_name, uid);
      const client = await setupClient();
      await client.setClientRole('audience');
      await client.join(appId, s.channel_name, token, uid);
      currentSession = s;
      isHosting = false;
      document.getElementById('remoteVideo').style.display = 'block';
      document.getElementById('localVideo').style.display = 'none';
      document.getElementById('stageTitle').textContent = s.title || 'Live session';
      document.getElementById('stageHost').textContent = 'Hosted by ' + (s.profiles?.display_name || 'someone');
      document.getElementById('audienceControls').style.display = 'flex';
      document.getElementById('tipRow').style.display = 'flex';
      renderTipRow(s.tip_options);
      showStage();
      startQuotaTracking();
      openLiveChat();
      watchForKick();
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  document.getElementById('leaveLiveBtn').onclick = leaveStage;

  document.getElementById('goLiveBtn').onclick = async () => {
    if (me.subscription_tier !== 'premium' && !me.is_admin) {
      const { data: remaining } = await supabase.rpc('get_live_seconds_remaining');
      if (remaining !== undefined && remaining <= 0) {
        toast('You\'ve used your 5 free minutes of live video today. Upgrade to Premium for unlimited access.', 'error');
        setTimeout(() => window.location.href = 'pricing.html', 1400);
        return;
      }
    }
    const title = prompt('What\'s your live session called?');
    if (title === null) return;
    const { data: created, error } = await supabase.from('live_sessions').insert({
      host_id: me.id, title: title.trim() || 'Live with ' + me.display_name, is_paid: false, status: 'scheduled',
    }).select().single();
    if (error) { toast(error.message, 'error'); return; }

    try {
      const uid = randomUid();
      const { token, appId } = await getToken(created.channel_name, uid);
      const client = await setupClient();
      await client.setClientRole('host');
      await client.join(appId, created.channel_name, token, uid);

      // Mic and camera are requested independently so a missing/blocked
      // device (common on desktops with no webcam or mic) doesn't kill the
      // whole "go live" flow -- the host just goes live with whichever
      // device is actually available. Viewers can keep joining and leaving
      // throughout -- there's no need for the host to restart anything when
      // someone new tunes in.
      const deviceWarnings = [];
      try {
        localTracks.mic = await AgoraRTC.createMicrophoneAudioTrack();
      } catch (e) {
        console.error('mic track failed', e);
        deviceWarnings.push(e?.code === 'DEVICE_NOT_FOUND' ? 'no microphone found' : 'microphone unavailable');
      }
      try {
        localTracks.cam = await AgoraRTC.createCameraVideoTrack();
      } catch (e) {
        console.error('camera track failed', e);
        deviceWarnings.push(e?.code === 'DEVICE_NOT_FOUND' ? 'no camera found' : 'camera unavailable');
      }
      if (!localTracks.mic && !localTracks.cam) {
        throw new Error('No camera or microphone available on this device.');
      }
      if (localTracks.cam) {
        localTracks.cam.play('localVideo');
        document.getElementById('localVideo').style.display = 'block';
      } else {
        document.getElementById('localVideo').style.display = 'none';
      }
      document.getElementById('remoteVideo').style.display = 'none';
      const tracksToPublish = [localTracks.mic, localTracks.cam].filter(Boolean);
      await client.publish(tracksToPublish);
      if (deviceWarnings.length) {
        toast('Live with ' + (localTracks.mic ? '' : 'no mic, ') + (localTracks.cam ? '' : 'no camera, ') + 'check your device settings to add it.', 'error');
      }

      await supabase.from('live_sessions').update({ status: 'live', started_at: new Date().toISOString() }).eq('id', created.id);
      await supabase.rpc('heartbeat_live_session', { p_session_id: created.id }).catch(e => console.error(e));

      currentSession = created;
      isHosting = true;
      document.getElementById('stageTitle').textContent = created.title;
      document.getElementById('stageHost').textContent = 'You are live';
      document.getElementById('hostControls').style.display = 'flex';
      showStage();
      startQuotaTracking();
      startHeartbeat();
      openLiveChat();
      refreshAudience();
      // Poll the audience panel while it's open (Realtime UPDATE/INSERT on
      // live_session_participants would also work, but simple polling is
      // plenty responsive for the panel and keeps this straightforward).
      const audiencePoll = setInterval(() => {
        if (!currentSession || !isHosting) { clearInterval(audiencePoll); return; }
        refreshAudience();
      }, 8000);
      toast('You\'re live!', 'success');
    } catch (e) {
      toast(e.message, 'error');
      await supabase.from('live_sessions').delete().eq('id', created.id);
    }
  };

  let micOn = true, camOn = true;
  document.getElementById('toggleMicBtn').onclick = async () => {
    micOn = !micOn;
    await localTracks.mic?.setEnabled(micOn);
    document.getElementById('toggleMicBtn').textContent = micOn ? '🎤 Mute' : '🔇 Unmute';
  };
  document.getElementById('toggleCamBtn').onclick = async () => {
    camOn = !camOn;
    await localTracks.cam?.setEnabled(camOn);
    document.getElementById('toggleCamBtn').textContent = camOn ? '📷 Hide cam' : '📷 Show cam';
  };
  document.getElementById('endLiveBtn').onclick = async () => {
    if (!confirm('End your live session?')) return;
    await leaveStage();
    toast('Live session ended.', 'success');
  };

  (async () => {
    session = await requireAuth();
    if (!session) return;
    me = await requireProfile(session);
    if (!me) return;

    // Self-heal: if a previous session of ours (e.g. a crashed tab) was
    // left stuck 'live' server-side, clean it up now so "Go live" isn't
    // blocked and other users don't see a dead stream.
    try {
      const { data: healed } = await supabase.rpc('force_end_my_live_sessions');
      if (healed > 0) toast('Ended a previous live session that had disconnected.', '');
    } catch (e) { console.error(e); }

    if (me.subscription_tier === 'premium' || me.is_admin) {
      document.getElementById('goLiveText').textContent = 'Ready to go live? Your audience will see you instantly.';
    } else {
      const { data: remaining } = await supabase.rpc('get_live_seconds_remaining');
      if (remaining !== undefined && remaining !== null) {
        document.getElementById('goLiveCard').insertAdjacentHTML('beforeend',
          `<div class="quota-badge">⏱ ${fmtMinSec(remaining)} left today</div>`);
      }
    }
    await loadLiveSessions();
    await handlePaystackReturn();
  })();
</script>
</body>
</html>
