<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — MeetNMingle</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  .auth-wrap { max-width: 400px; margin: 0 auto; padding: 40px 20px 60px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .auth-card { padding: 32px 28px; }
  .brand { text-align: center; margin-bottom: 24px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="brand"><div class="logo" style="font-size:1.6rem;">meet<em>n</em>mingle</div></div>
  <div class="card auth-card">
    <h2 class="display" style="margin-top:0; font-size:1.3rem;">Set a new password</h2>
    <div id="linkNotice" style="display:none;">
      <p style="color:var(--cream-dim); font-size:0.88rem;">This reset link is invalid or has expired. Request a new one.</p>
      <a href="forgot-password.html" class="btn btn-primary btn-block" style="margin-top:10px;">Request new link</a>
    </div>
    <form id="resetForm" style="display:none;">
      <div class="field">
        <label>New password</label>
        <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
      </div>
      <div id="formError" class="field-error"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Update password</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase } from './js/supabaseClient.js';

  function toast(msg, type='') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + type;
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  (async () => {
    // Supabase's client parses the recovery token from the URL hash automatically
    // (detectSessionInUrl: true) and fires a PASSWORD_RECOVERY auth event.
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      document.getElementById('resetForm').style.display = 'block';
    } else {
      supabase.auth.onAuthStateChange((event, s) => {
        if (event === 'PASSWORD_RECOVERY' && s) {
          document.getElementById('resetForm').style.display = 'block';
        }
      });
      setTimeout(async () => {
        const { data: { session: s2 } } = await supabase.auth.getSession();
        if (!s2 && document.getElementById('resetForm').style.display === 'none') {
          document.getElementById('linkNotice').style.display = 'block';
        }
      }, 1500);
    }
  })();

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('formError');
    errEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Updating…';
    const { error } = await supabase.auth.updateUser({ password: document.getElementById('newPassword').value });
    btn.disabled = false; btn.textContent = 'Update password';
    if (error) { errEl.textContent = error.message; return; }
    toast('Password updated!', 'success');
    setTimeout(() => window.location.href = 'discover.html', 1200);
  });
</script>
</body>
</html>
